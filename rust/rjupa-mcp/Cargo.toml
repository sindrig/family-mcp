[package]
name = "rjupa-mcp"
version = "0.1.0"
description = "Ptarmigan hanging degree-days from rjupa.irdn.is with reminder milestones"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
# Loopback fake upstream only; release builds never enable it.
test-origin = []

[dependencies]
chrono = { version = "=0.4.45", default-features = false, features = ["now"] }
mcp-runtime = { path = "../mcp-runtime" }
reqwest = { version = "=0.13.5", default-features = false, features = ["rustls", "json"] }
rmcp = { version = "=3.5.1", default-features = false, features = ["server"] }
serde_json = { version = "=1.0.151", features = ["preserve_order"] }
tokio = { version = "=1.53.2", features = ["rt", "macros", "sync", "time"] }
